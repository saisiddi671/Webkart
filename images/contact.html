<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <header class="nav-bar">
        <a href="home.html" class="logo">🛒Web<span>Kart</span></a>
        <nav>
            <a href="home.html" class="home1">Home</a>
            <a href="products.html">Products</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="MainContact">
        <div class="subContact">
            <center>
                <h1>We'd Love to Hear From You</h1>
                <p><strong>Have a Question? We are here to help.</strong></p>
            </center>
        </div>
        <div class="FormDiv">
            <div class="mainform">


                <form action="#">
                    <label for="Fullname">Fullname</label><br>
                    <input type="text" name="Fullname" placeholder="Enter Your name">
                    <br><br>
                    <label for="Email">Email Address</label><br>
                    <input type="email" name="Email" placeholder="Enter Your Email">
                    <br>
                    <label for="Message">Message</label><br>
                    <textarea name="Message" rows="4" cols="30"></textarea>

                    <br>

                    <button>Send Message</button>
                </form>
            </div>
            <div class="subForm">
                <div class="Detail">
                    <h3>📩Email</h3>
                    <p>shopora@gmail.com</p>
                </div>
                <div class="Detail">
                    <h3>📞Phone</h3>
                    <p>9876543210</p>
                </div>
                <div class="Detail">
                    <h3>📍Location</h3>
                    <p>Vishakapatnam, India</p>
                </div>
                <div class="Detail">
                    <h3>🕑Working hours</h3>
                    <p>Mon - Sat : 9.00 AM - 9.00 PM<br>Sun : 10.00 AM - 6.00 PM</p>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
